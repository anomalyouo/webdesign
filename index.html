<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ERROR - GALAXIA SYSTEM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* 共用色彩設定，方便統一調整頁面的主題 */
        :root {
            --sao-cyan: #55e9ff;
            --sao-glow: rgba(85, 233, 255, 0.55);
            --sao-dark-bg: rgba(5, 7, 18, 0.82);
            --sao-frame: rgba(85, 233, 255, 0.78);
            --sao-copy: rgba(255, 255, 255, 0.86);
        }

        /* 清除瀏覽器預設間距，並統一元素尺寸計算方式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 頁面背景、字體與主要內容置中 */
        body {
            min-height: 100vh;
            min-height: 100svh;
            background-color: #03040b;
            background-image:
                radial-gradient(ellipse at 24% 42%, rgba(64, 39, 117, 0.38), transparent 43%),
                linear-gradient(90deg, rgba(2, 3, 10, 0.24), rgba(2, 3, 10, 0.82)),
                url('imgs/bg.jpg');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Lato', 'Noto Sans JP', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px;
        }

        /* 疊加掃描線與淡淡的中央分隔光線 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 49.9%, rgba(233, 216, 154, 0.035) 50%, transparent 50.1%),
                linear-gradient(rgba(255, 255, 255, 0.018) 50%, transparent 50%);
            background-size: 100% 100%, 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        /* 桌面版採左右雙欄：角色圖在左、訊息框在右 */
        .container {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(400px, 0.92fr);
            align-items: center;
            gap: clamp(24px, 5vw, 76px);
            width: min(1240px, 100%);
        }

        /* 角色圖片大小、光影與漂浮動畫 */
        .yui-character {
            display: block;
            width: 100%;
            max-width: 680px;
            height: auto;
            justify-self: center;
            filter: drop-shadow(0 18px 55px rgba(95, 66, 181, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        /* 角色上下輕微浮動 */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(0.5deg); }
        }

        /* 半透明錯誤面板搭配原版的四角框線 */
        .error-box {
            background: var(--sao-dark-bg);
            border: 1px solid rgba(85, 233, 255, 0.24);
            box-shadow: 0 18px 80px rgba(0, 0, 0, 0.48), inset 0 0 45px rgba(88, 70, 156, 0.12);
            backdrop-filter: blur(12px);
            padding: clamp(36px, 5vw, 64px);
            position: relative;
        }

        /* 四角 L 形裝飾沿用原版 frame 元件的線條語彙 */
        .error-box::before,
        .error-box::after {
            content: "";
            position: absolute;
            inset: 8px;
            pointer-events: none;
            background-repeat: no-repeat;
        }

        .error-box::before {
            background-image:
                linear-gradient(var(--sao-frame), var(--sao-frame)),
                linear-gradient(var(--sao-frame), var(--sao-frame)),
                linear-gradient(var(--sao-frame), var(--sao-frame)),
                linear-gradient(var(--sao-frame), var(--sao-frame));
            background-size: 18px 2px, 2px 18px;
            background-position: left top, left top, right top, right top;
        }

        .error-box::after {
            background-image:
                linear-gradient(var(--sao-frame), var(--sao-frame)),
                linear-gradient(var(--sao-frame), var(--sao-frame)),
                linear-gradient(var(--sao-frame), var(--sao-frame)),
                linear-gradient(var(--sao-frame), var(--sao-frame));
            background-size: 18px 2px, 2px 18px;
            background-position: left bottom, left bottom, right bottom, right bottom;
        }

        /* 錯誤主標題 */
        .error-code {
            font-size: clamp(2rem, 3vw, 3rem);
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.05em;
            line-height: 1.08;
            margin-bottom: 18px;
            text-shadow: 0 0 28px var(--sao-glow);
        }

        /* 中英文錯誤副標題 */
        .error-title {
            font-size: clamp(1rem, 1.6vw, 1.2rem);
            color: var(--sao-cyan);
            margin-bottom: 22px;
            letter-spacing: 0.04em;
            font-weight: 600;
            line-height: 1.6;
        }

        /* 錯誤說明文字與段落間距 */
        .error-desc {
            font-size: 0.95rem;
            color: var(--sao-copy);
            line-height: 1.8;
            margin-bottom: 34px;
        }

        .error-desc p + p {
            margin-top: 14px;
        }

        /* 按鈕水平排列，空間不足時自動換行 */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        /* 按鈕共用樣式 */
        .sao-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            --sao-btn-fill: rgba(255, 255, 255, 0.035);
            position: relative;
            isolation: isolate;
            background: var(--sao-cyan);
            border: 0;
            color: rgba(255, 255, 255, 0.72);
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        /* 內層背景向內裁切一像素，保留斜角外框 */
        .sao-btn::before {
            content: "";
            position: absolute;
            inset: 1px;
            z-index: -1;
            background: var(--sao-btn-fill);
            clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%, 0 11px);
            pointer-events: none;
            transition: background-color 0.3s ease;
        }

        /* 滑鼠移到按鈕時的反白效果 */
        .sao-btn:hover {
            --sao-btn-fill: var(--sao-cyan);
            color: #11101a;
            box-shadow: 0 0 24px var(--sao-glow);
            transform: translateY(-2px);
        }

        /* 平板與窄螢幕改為上下排列 */
        @media (max-width: 850px) {
            body {
                padding: 48px 24px 32px;
            }

            .container {
                grid-template-columns: minmax(0, 1fr);
                gap: 0;
                max-width: 640px;
            }

            .yui-character {
                width: min(76%, 400px);
                margin-bottom: -48px;
                z-index: 1;
            }

            .error-box {
                z-index: 2;
            }
        }

        /* 手機版縮小間距，並讓按鈕垂直排列 */
        @media (max-width: 520px) {
            body {
                padding: 44px 18px 24px;
                background-attachment: scroll;
            }

            .yui-character {
                width: min(82%, 330px);
                margin-bottom: -34px;
            }

            .error-box {
                padding: 42px 24px 30px;
            }

            .error-desc {
                font-size: 0.98rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .sao-btn {
                width: 100%;
            }
        }

        /* 使用者偏好減少動態效果時，停用動畫與轉場 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 結衣精靈角色圖 -->
        <img src="imgs/Yui_rbg.png" alt="Yui Navigation Sprite" class="yui-character" width="1335" height="1178">

        <!-- 系統錯誤對話框 -->
        <div class="error-box">
            <div class="error-code">SYSTEM ERROR</div>
            <div class="error-title">伺服器連線異常 / <br>
                Galaxia System Disconnected</div>
            <div class="error-desc">
                <p>「爸爸、媽媽……對不起，結衣暫時找不到前方的網頁了……」</p>
                <p>請先確認您的網路環境是否穩定</p>
                <p>或者等一下再讓結衣重新幫您搜尋一次！</p>
            </div>
            
            <div class="btn-group">
                <a href="https://fd.sao-game.jp/" class="sao-btn">返回首頁</a>
                <button class="sao-btn" onclick="location.reload();">重新整理</button>
            </div>
        </div>
    </div>

</body>
</html>
