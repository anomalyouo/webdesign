<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ERROR - GALAXIA SYSTEM</title>
    <style>
        :root {
            --sao-cyan: #55e9ff;
            --sao-blue: #8d6cff;
            --sao-glow: rgba(85, 233, 255, 0.55);
            --sao-dark-bg: rgba(5, 7, 18, 0.82);
            --sao-border: #d8c17b;
            --sao-gold: #e9d89a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background-color: #03040b;
            background-image:
                radial-gradient(ellipse at 24% 42%, rgba(64, 39, 117, 0.38), transparent 43%),
                linear-gradient(90deg, rgba(2, 3, 10, 0.24), rgba(2, 3, 10, 0.82)),
                url('imgs/bg.jpg');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 48px;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 49.9%, rgba(233, 216, 154, 0.035) 50%, transparent 50.1%),
                linear-gradient(rgba(255, 255, 255, 0.018) 50%, transparent 50%);
            background-size: 100% 100%, 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(400px, 0.92fr);
            align-items: center;
            gap: clamp(24px, 5vw, 76px);
            width: min(1240px, 100%);
        }

        .yui-character {
            display: block;
            width: 100%;
            max-width: 680px;
            height: auto;
            justify-self: center;
            filter: drop-shadow(0 18px 55px rgba(95, 66, 181, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(0.5deg); }
        }

        .error-box {
            background: var(--sao-dark-bg);
            border: 1px solid rgba(233, 216, 154, 0.65);
            box-shadow: 0 18px 80px rgba(0, 0, 0, 0.48), inset 0 0 45px rgba(88, 70, 156, 0.12);
            backdrop-filter: blur(12px);
            padding: clamp(36px, 5vw, 64px);
            position: relative;
            clip-path: polygon(
                0 24px, 24px 0,
                100% 0,
                100% calc(100% - 24px), calc(100% - 24px) 100%,
                0 100%
            );
        }

        .error-box::before {
            content: "SYSTEM_WARNING // GALAXIA_DISPLACED";
            position: absolute;
            top: 0;
            left: 32px;
            transform: translateY(-50%);
            background: #11101a;
            border: 1px solid var(--sao-gold);
            color: var(--sao-gold);
            font-size: 10px;
            font-weight: 800;
            padding: 7px 12px;
            letter-spacing: 1.5px;
        }

        .error-box::after {
            content: "";
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-bottom: 2px solid var(--sao-gold);
            border-right: 2px solid var(--sao-gold);
        }

        .error-code {
            font-size: clamp(2rem, 3vw, 3rem);
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.05em;
            line-height: 1.08;
            margin-bottom: 18px;
            text-shadow: 0 0 28px rgba(141, 108, 255, 0.62);
        }

        .error-title {
            font-size: clamp(1rem, 1.6vw, 1.2rem);
            color: var(--sao-cyan);
            margin-bottom: 22px;
            letter-spacing: 0.04em;
            font-weight: 600;
        }

        .error-desc {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.9;
            margin-bottom: 34px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .sao-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(233, 216, 154, 0.75);
            color: #ffffff;
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        .sao-btn:hover {
            background: var(--sao-gold);
            color: #11101a;
            box-shadow: 0 0 24px rgba(233, 216, 154, 0.32);
            transform: translateY(-2px);
        }

        .sao-btn.primary {
            background: var(--sao-gold);
            color: #11101a;
        }

        .sao-btn.primary:hover {
            background: #fff0b4;
        }

        @media (max-width: 850px) {
            body {
                padding: 48px 24px 32px;
            }

            .container {
                grid-template-columns: minmax(0, 1fr);
                gap: 0;
                max-width: 640px;
            }

            .yui-character {
                width: min(76%, 400px);
                margin-bottom: -48px;
                z-index: 1;
            }

            .error-box {
                z-index: 2;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 44px 18px 24px;
                background-attachment: scroll;
            }

            .yui-character {
                width: min(82%, 330px);
                margin-bottom: -34px;
            }

            .error-box {
                padding: 42px 24px 30px;
            }

            .error-box::before {
                left: 18px;
                font-size: 8px;
                letter-spacing: 1px;
            }

            .error-title {
                line-height: 1.6;
            }

            .error-desc {
                font-size: 0.98rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .sao-btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 結衣精靈角色圖 -->
        <img src="imgs/Yui_rbg.png" alt="Yui Navigation Sprite" class="yui-character">

        <!-- 系統錯誤對話框 -->
        <div class="error-box">
            <div class="error-code">SYSTEM ERROR</div>
            <div class="error-title">伺服器連線異常 / Galaxia System Disconnected</div>
            <div class="error-desc">
                「爸爸、媽媽……對不起，結衣暫時找不到前方的網頁了……」
            </div>
            
            <div class="btn-group">
                <a href="https://fd.sao-game.jp/" class="sao-btn primary">返回首頁</a>
                <button class="sao-btn" onclick="location.reload();">重新整理</button>
            </div>
        </div>
    </div>

</body>
</html>
