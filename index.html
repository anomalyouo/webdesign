<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ERROR - GALAXIA SYSTEM</title>
    <style>
        /* CSS 變數：設定官方藍色基調 */
        :root {
            --sao-cyan: #00d2ff;
            --sao-blue: #0077ff;
            --sao-glow: rgba(0, 210, 255, 0.6);
            --sao-dark-bg: rgba(2, 12, 27, 0.85);
            --sao-border: #00a8ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: url('imgs/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 掃描線與全息網格特效 */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(0, 210, 255, 0.03), rgba(0, 119, 255, 0.01), rgba(0, 210, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 720px;
            padding: 20px;
        }

        /* 結衣精靈圖片漂浮動畫 */
        .yui-character {
            width: 170px;
            height: auto;
            margin-bottom: -25px;
            z-index: 25;
            filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.7));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(0.5deg); }
        }

        /* 警示視窗 */
        .error-box {
            background: var(--sao-dark-bg);
            border: 2px solid var(--sao-border);
            box-shadow: 0 0 35px rgba(0, 168, 255, 0.35), inset 0 0 25px rgba(0, 210, 255, 0.15);
            padding: 40px 50px;
            position: relative;
            clip-path: polygon(
                0 25px, 25px 0, 
                100% 0, 
                100% calc(100% - 25px), calc(100% - 25px) 100%, 
                0 100%
            );
        }

        /* 裝飾性系統標籤 */
        .error-box::before {
            content: "SYSTEM_WARNING // GALAXIA_DISPLACED";
            position: absolute;
            top: -12px;
            left: 25px;
            background: var(--sao-cyan);
            color: #000814;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 12px;
            letter-spacing: 2px;
        }

        /* 裝飾性外框線條（角落標記） */
        .error-box::after {
            content: "";
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 15px;
            height: 15px;
            border-bottom: 2px solid var(--sao-cyan);
            border-right: 2px solid var(--sao-cyan);
        }

        .error-code {
            font-size: 2.4rem;
            color: var(--sao-cyan);
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--sao-glow);
        }

        .error-title {
            font-size: 1.15rem;
            color: #b3e5fc;
            margin-bottom: 18px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .error-desc {
            font-size: 0.95rem;
            color: #81d4fa;
            line-height: 1.7;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        /* 按鈕群組 */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .sao-btn {
            background: rgba(0, 119, 255, 0.15);
            border: 1px solid var(--sao-cyan);
            color: #ffffff;
            padding: 12px 30px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            box-shadow: inset 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .sao-btn:hover {
            background: var(--sao-cyan);
            color: #000814;
            box-shadow: 0 0 20px var(--sao-cyan);
            transform: translateY(-2px);
        }

        .sao-btn.primary {
            background: rgba(0, 210, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 結衣精靈角色圖 -->
        <img src="imgs/Yui_rbg.png" alt="Yui Navigation Sprite" class="yui-character">

        <!-- 系統錯誤對話框 -->
        <div class="error-box">
            <div class="error-code">SYSTEM ERROR</div>
            <div class="error-title">伺服器連線異常 / Galaxia System Disconnected</div>
            <div class="error-desc">
                「爸爸、媽媽……對不起，結衣暫時找不到前方的網頁了……」
            </div>
            
            <div class="btn-group">
                <a href="https://fd.sao-game.jp/" class="sao-btn primary">返回首頁</a>
                <button class="sao-btn" onclick="location.reload();">重新整理</button>
            </div>
        </div>
    </div>

</body>
</html>
